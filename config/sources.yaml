# Curated daily sources, checked 2026-10-31 by fetching each one (subscriber counts and "last post" from the
# public preview / feed on that date). These are monitored every day; web search only suggests new ones.
# access: rss | json_api | telegram (public t.me/s/ preview, no login) | html | browser_needed (bot wall) | login_required
# Third-party channels repost other people's listings: the agent always follows the post to the official page.
