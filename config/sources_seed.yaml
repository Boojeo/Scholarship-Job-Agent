# Opt-in channels (disabled by default: terms-of-service and account-ban risk).
opt_in:
  x_queries:
    - '("PhD position" OR "MS position" OR "Master scholarship") ("Machine Learning" OR "AI" OR "Computer Vision" OR "NLP") -filter:retweets'
    - '("تدريب تعاوني" OR "حديث التخرج") ("حاسب" OR "ذكاء اصطناعي" OR "برمجة")'
    - '("AI Engineer" OR "ML Engineer" OR "Software Engineer") ("Riyadh" OR "Saudi" OR "Dubai" OR "UAE" OR "Remote") hiring'
  youtube_queries:
    - "fully funded scholarship without IELTS"
    - "MOI accepted scholarships"
    - "AI internships scholarships"
  telegram_channels: []   # filled by research / discovery; public t.me/s/<handle> previews only
