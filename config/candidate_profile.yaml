# Hard rules enforced by matcher, tailoring and the pre-submit gate.
rules:
  never_fabricate: true
  tailoring_allowed: ["reorder", "reword", "emphasise", "match keywords from the posting", "translate", "shorten"]
  tailoring_forbidden: ["invented skills, employers, projects, publications, dates or grades"]
  require_final_verification_before_submit: true
  never_automate: ["account creation", "payments", "legal declarations", "visa or criminal-record questions"]
  first_application_requires_user_approval: true
